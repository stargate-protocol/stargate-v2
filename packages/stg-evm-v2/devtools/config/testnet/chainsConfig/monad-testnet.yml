name: monad-testnet
status: DEPRECATED
eid: MONAD_V2_TESTNET
token_messaging: true
credit_messaging: true
tokens:
  eth:
    type: pool
  usdt:
    type: pool
  usdc:
    type: pool
rewarder:
  tokens:
    mock_a:
      allocation:
        eth: 1
        usdc: 1
        usdt: 1
staking:
  tokens:
    eth: true
    usdc: true
    usdt: true
treasurer:
  tokens:
    eth: true
    usdt: true
    usdc: true
unwire:
  # The legacy Monad messaging contracts have no bytecode on the current RPC.
  # Kaia and Mantle remain reachable, so clear their peer entries for Monad here.
  chain_shutdown: true
  token_messaging:
    direction: both
    allowed_peers:
      - monad-testnet
    deprecated_peers:
      - mantlesep-testnet
      - klaytn-testnet
  credit_messaging:
    direction: both
    allowed_peers:
      - monad-testnet
    deprecated_peers:
      - mantlesep-testnet
      - klaytn-testnet
